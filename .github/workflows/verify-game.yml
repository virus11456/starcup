name: Verify game rules and Cloudflare build

on:
  push:
    branches:
      - fix/hand-hidden-slot-20261027
  pull_request:
    branches:
      - main
      - work/deploy-verified-20261027

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact proposed commit
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify rules, engine, Cloudflare runtime, build and HTTP tests
        run: npm run verify:local
      - name: Install CJK glyphs for realistic Chinese-language browser QA
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: Install temporary browser controller
        run: npm install --prefix /tmp/starcup-visual-qa --no-audit --no-fund --ignore-scripts playwright-core@1.56.1
      - name: Install WebKit for real mobile draft acceptance
        run: node /tmp/starcup-visual-qa/node_modules/playwright-core/cli.js install --with-deps webkit
      - name: Verify Chromium and WebKit viewport render and mobile draft controls
        run: node scripts/check-browser-layout.mjs
      - name: Upload browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starcup-visual-qa
          path: outputs/visual-qa/*.png
          if-no-files-found: ignore
