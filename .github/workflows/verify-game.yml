name: Verify game rules and Cloudflare build

on:
  push:
    branches:
      - fix/hand-hidden-slot-20261027
  pull_request:
    branches:
      - main
      - work/deploy-verified-20261027

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact proposed commit
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify rules, engine, Cloudflare runtime, build and HTTP tests
        run: npm run verify:local
