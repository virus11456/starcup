<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>版面尺寸檢查</title><style>body{margin:0;background:#273334;color:#eee;font:14px system-ui}header{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px;position:sticky;top:0;background:#172325;z-index:1}button,select{font:inherit;padding:10px;border-radius:5px;border:1px solid #7d9491;background:#253c3f;color:#fff}button[aria-pressed=true]{background:#dbc68b;color:#142021}iframe{display:block;background:#101820;border:0;margin:20px auto;max-width:none}main{overflow:auto}output{padding:8px}</style></head><body><header><span>版面尺寸檢查</span><select aria-label="測試頁面"><option value="/">首頁</option><option value="/cards">卡牌圖鑑</option><option value="/learn">教學</option><option value="/rules">規則</option><option value="/full">完整擴充</option></select><button data-size="390,844">手機 390</button><button data-size="768,1024">iPad 直向</button><button data-size="1024,768">iPad 橫向</button><button data-size="1440,900">電腦 1440</button><output aria-live="polite"></output></header><main><iframe title="待測試網站" src="/" width="390" height="844"></iframe></main><script>const frame=document.querySelector('iframe');function size(button){const [w,h]=button.dataset.size.split(',');frame.width=w;frame.height=h;document.querySelector('output').textContent=w+' × '+h;for(const b of document.querySelectorAll('button'))b.setAttribute('aria-pressed',String(b===button));}document.querySelector('select').addEventListener('change',e=>frame.src=e.target.value);for(const b of document.querySelectorAll('button'))b.addEventListener('click',()=>size(b));size(document.querySelector('button'));</script></body></html>
